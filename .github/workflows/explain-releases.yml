# This repository's own release explainer, set up as
# https://bisque.today/docs/github.md describes. When a release is published,
# Claude Code reads its notes and the diff since the previous tag, and the
# watch link is appended to the notes a few minutes later.
#
# To explain a release that is already out, run this workflow by hand with its
# tag.
name: Release explainer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to explain, such as v0.1.37"
        type: string
        required: true

permissions:
  contents: write # append the watch link to the release notes
  id-token: write # sign in with GitHub to publish

concurrency:
  group: explain-release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - uses: bisque-cloud/presenter@7159a1bda766df3900465cdbcc532fc5a8de495f # v1.9.4
        with:
          tag: ${{ inputs.tag }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
